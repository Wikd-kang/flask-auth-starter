{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>登录</h1>
  <p class="sub">演示账号：admin / admin123</p>

  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}

  <form method="post" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    <label>用户名
      <input name="username" value="{{ username }}" required autofocus>
    </label>
    <label>密码
      <input type="password" name="password" required>
    </label>
    <label class="check">
      <input type="checkbox" name="remember" value="1"> 记住我（7 天）
    </label>
    <button type="submit">登录</button>
  </form>

  <p class="alt">还没有账号？<a href="{{ url_for('auth.register') }}">注册一个</a></p>
</div>
{% endblock %}
